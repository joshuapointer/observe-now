# Every push to `main` ships "Observe Now" (prod backend). Releasing an App Store build is still a manual step
# in App Store Connect.
# Each platform checks its fingerprint first. If nothing native changed since its last build, it publishes an
# over-the-air update to the "production" channel instead, which installed apps download on their next launch.
name: Production release

on:
  push:
    branches: ['main']

jobs:
  fingerprint:
    type: fingerprint
    environment: production

  # iOS: a new build goes to App Store Connect / TestFlight.
  get_ios_build:
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    type: build
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    params:
      platform: ios
      profile: production

  submit_ios:
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  update_ios:
    type: update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    environment: production
    params:
      platform: ios
      channel: production

  # Android: a new APK goes to Firebase App Distribution (the "testers" group in behavior-observation-2d03f).
  get_android_build:
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      profile: production-apk
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  build_android:
    type: build
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    params:
      platform: android
      profile: production-apk

  distribute_android:
    needs: [build_android]
    environment: production
    env:
      NOTES: ${{ github.commit_message }}
    steps:
      - uses: eas/download_build
        id: apk
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
          extensions: [apk]
      - name: Upload to Firebase App Distribution
        run: |
          echo "$FIREBASE_DISTRIBUTION_KEY" | base64 -d > "$HOME/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-key.json"
          npx -y firebase-tools@latest appdistribution:distribute "${{ steps.apk.outputs.artifact_path }}" \
            --app 1:1016222315473:android:fe9adfc89b3d301bb166f0 --project behavior-observation-2d03f --groups testers \
            --release-notes "${NOTES:-Build from $EAS_BUILD_ID}"
          rm -f "$HOME/firebase-key.json"

  update_android:
    type: update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    environment: production
    params:
      platform: android
      channel: production
