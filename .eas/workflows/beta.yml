# Every push to `beta` ships "Observe Now Beta" (dev backend) to TestFlight and Firebase App Distribution.
# Each platform checks its fingerprint first. If nothing native changed since its last build, it publishes an
# over-the-air update to the "beta" channel instead, which installed apps download on their next launch.
name: Beta release

on:
  push:
    branches: ['beta']

jobs:
  fingerprint:
    type: fingerprint
    environment: preview

  # iOS: a new build goes to App Store Connect / TestFlight.
  get_ios_build:
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: beta
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    type: build
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    params:
      platform: ios
      profile: beta

  submit_ios:
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: beta

  update_ios:
    type: update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    environment: preview
    params:
      platform: ios
      channel: beta

  # Android: a new APK goes to Firebase App Distribution (the "testers" group in garth-log-dev).
  get_android_build:
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      profile: beta-apk
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  build_android:
    type: build
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    params:
      platform: android
      profile: beta-apk

  distribute_android:
    needs: [build_android]
    environment: preview
    env:
      NOTES: ${{ github.commit_message }}
    steps:
      - uses: eas/download_build
        id: apk
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
          extensions: [apk]
      - name: Upload to Firebase App Distribution
        run: |
          echo "$FIREBASE_DISTRIBUTION_KEY" | base64 -d > "$HOME/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-key.json"
          npx -y firebase-tools@latest appdistribution:distribute "${{ steps.apk.outputs.artifact_path }}" \
            --app 1:150892806433:android:393ddddcaa8bdb1adc7e60 --project garth-log-dev --groups testers \
            --release-notes "${NOTES:-Build from $EAS_BUILD_ID}"
          rm -f "$HOME/firebase-key.json"

  update_android:
    type: update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    environment: preview
    params:
      platform: android
      channel: beta
