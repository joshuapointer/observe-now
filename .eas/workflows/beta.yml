# Every push to `beta` builds "Observe Now Beta" (dev backend) and uploads it to TestFlight.
name: Beta to TestFlight

on:
  push:
    branches: ['beta']

jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: beta

  submit_ios:
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: beta
