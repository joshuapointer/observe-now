# Every push to `beta` for "Observe Now Beta" (dev backend): a new native build goes to TestFlight.
# If nothing native changed since the last build (same fingerprint), it publishes an over-the-air update to the
# "beta" channel instead, which installed apps download on their next launch. iOS only for now.
name: Beta to TestFlight

on:
  push:
    branches: ['beta']

jobs:
  fingerprint:
    type: fingerprint
    environment: preview

  get_ios_build:
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: beta
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  build_ios:
    type: build
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    params:
      platform: ios
      profile: beta

  submit_ios:
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: beta

  update_ios:
    type: update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    environment: preview
    params:
      platform: ios
      channel: beta
