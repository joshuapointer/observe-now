# Practice-mode walk-through on an iPhone simulator. Start Metro first: npm run demo
# Expo Go must be installed on the simulator (npx expo start --ios does that once).
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: exp://127.0.0.1:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Continue|The care device.*|Reload"
    timeout: 90000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - swipe:
          start: 50%, 50%
          end: 50%, 98%
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "The care device"
    timeout: 30000
- takeScreenshot: 01-auth
- tapOn: "The care device"
- extendedWaitUntil:
    visible: "Start a shift"
    timeout: 15000
- takeScreenshot: 02-roster
- tapOn: "Dana R."
- takeScreenshot: 03-pin
- tapOn: "Digit 1"
- tapOn: "Digit 2"
- tapOn: "Digit 3"
- tapOn: "Digit 4"
- extendedWaitUntil:
    visible: "Welcome to Observe Now"
    timeout: 15000
- takeScreenshot: 04-welcome
- tapOn: "Let's go"
- takeScreenshot: 05-now
- tapOn: "Record and more"
- tapOn: "Record"
- tapOn: "Sleep and waking.*"
- tapOn: ".*Sleeping.*"
- takeScreenshot: 06-record-sheet
- tapOn: "Save .*"
- takeScreenshot: 07-saved
- assertVisible: "Saved.*"
- tapOn: "Undo"
- assertVisible: "Undone"
- tapOn: "Record and more"
- tapOn: "Record"
- tapOn: "Sleep and waking.*"
- tapOn: ".*Dozing off.*"
- tapOn: "Save .*"
- scrollUntilVisible:
    element: "RECORDED LATELY|Recorded lately"
    direction: DOWN
    centerElement: true
- takeScreenshot: 08-latest
- tapOn: "Messages"
- takeScreenshot: 09-messages
- tapOn: "New message to family"
- tapOn: "Write to family…"
- inputText: "Garth had a good dinner"
- tapOn: "Send"
- hideKeyboard:
    optional: true
- takeScreenshot: 10-sent
- tapOn: "Care"
- takeScreenshot: 11-care
- tapOn:
    text: "Give"
    index: 0
- takeScreenshot: 12-given
- scrollUntilVisible:
    element: "The last seven nights"
    direction: DOWN
    centerElement: true
- tapOn: "The last seven nights"
- extendedWaitUntil:
    visible: "SEVEN NIGHTS.*|Seven nights.*"
    timeout: 15000
- takeScreenshot: 13-week
- tapOn: "Back"
- tapOn: "What family see"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*right now.*"
    timeout: 10000
- takeScreenshot: 14-preview
- tapOn: "Back"
- tapOn: "Now"
- tapOn: "Record and more"
- tapOn: "Report a fall"
- takeScreenshot: 16-fall-confirm
- tapOn: "Yes — Garth had a fall"
- extendedWaitUntil:
    visible: "Fall recorded at.*"
    timeout: 10000
- tapOn: "Beside the bed"
- takeScreenshot: 17-fall-report
- tapOn: "Back"
- takeScreenshot: 18-now-after-fall
- tapOn: "You and this device"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Sign this device out"
    direction: DOWN
    centerElement: true
- takeScreenshot: 19-settings
- tapOn: "Sign this device out"
- tapOn: "Yes, sign out"
- tapOn: "Family (Ellen)"
- extendedWaitUntil:
    visible: "Let's go"
    timeout: 15000
- takeScreenshot: 20-family-welcome
- tapOn: "Let's go"
- extendedWaitUntil:
    visible: ".*right now.*"
    timeout: 15000
- takeScreenshot: 21-family
- tapOn: "Got it"
- takeScreenshot: 22-family-acked
- tapOn: "Reply"
- inputText: "Thank you Dana"
- tapOn: "Send reply"
- takeScreenshot: 23-family-replied
- tapOn: "History"
- takeScreenshot: 24-history
